<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-label="NVFP4 的编码与两级缩放"><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#35513e} [data-tip]{cursor:default}</style><rect width="760" height="448" fill="white"/><text x="25" y="28" font-size="17" font-weight="600">NVFP4 的编码与两级缩放</text><g transform="translate(0 44)"><rect width="760" height="310" fill="white"></rect><text x="30" y="30" fill="#35513e" font-size="14">E2M1 非负值域（符号位覆盖正负）</text><line x1="66" y1="100" x2="686" y2="100" stroke="#b3c5b8" stroke-width="2"></line><circle cx="66" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 0" tabindex="0" aria-label="E2M1: 0"></circle><text x="66" y="132" fill="#35513e" text-anchor="middle" font-size="20">0</text><circle cx="117.66666666666666" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 0.5" tabindex="0" aria-label="E2M1: 0.5"></circle><text x="117.66666666666666" y="132" fill="#35513e" text-anchor="middle" font-size="20">0.5</text><circle cx="169.33333333333331" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 1" tabindex="0" aria-label="E2M1: 1"></circle><text x="169.33333333333331" y="132" fill="#35513e" text-anchor="middle" font-size="20">1</text><circle cx="221" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 1.5" tabindex="0" aria-label="E2M1: 1.5"></circle><text x="221" y="132" fill="#35513e" text-anchor="middle" font-size="20">1.5</text><circle cx="272.66666666666663" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 2" tabindex="0" aria-label="E2M1: 2"></circle><text x="272.66666666666663" y="132" fill="#35513e" text-anchor="middle" font-size="20">2</text><circle cx="376" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 3" tabindex="0" aria-label="E2M1: 3"></circle><text x="376" y="132" fill="#35513e" text-anchor="middle" font-size="20">3</text><circle cx="479.3333333333333" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 4" tabindex="0" aria-label="E2M1: 4"></circle><text x="479.3333333333333" y="132" fill="#35513e" text-anchor="middle" font-size="20">4</text><circle cx="686" cy="100" r="8" fill="#309576" data-tip="E2M1: 6" tabindex="0" aria-label="E2M1: 6"></circle><text x="686" y="132" fill="#35513e" text-anchor="middle" font-size="20">6</text><rect x="28" y="170" width="704" height="83" rx="6" fill="#f2f7f1"></rect><text x="48" y="202" fill="#35513e" font-size="18">q = 6，块缩放因子 = 1，外层缩放因子 = 1</text><text x="48" y="232" fill="#35513e" font-size="18">解码 x̂ = q × 块缩放因子 × 外层缩放因子 = 6</text><text x="30" y="285" fill="#35513e" font-size="14">16 × 4 bits = 8 bytes；每块再存 1 byte E4M3 scale。</text></g><text x="25" y="378" font-size="11">指数 11：|q| = (1 + 1/2) × 2^(3−1) = 6。E2M1 的 11 指数仍表示有限值，最大值为 6</text><text x="25" y="398" font-size="11">。 · E2M1 数据占 4 比特，每 16 个元素共用 E4M3 块缩放因子，另有 FP32 外层缩放因子。点击四个编码</text><text x="25" y="418" font-size="11">位并切换缩放因子，查看有限值和解码结果；示例缩放因子为合法的可表示值。</text></svg>