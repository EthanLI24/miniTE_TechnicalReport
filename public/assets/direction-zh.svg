<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 453" role="img" aria-label="同样的 gap，更新方向决定局部风险"><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#35513e} [data-tip]{cursor:default}</style><rect width="760" height="453" fill="white"/><text x="25" y="28" font-size="17" font-weight="600">同样的 gap，更新方向决定局部风险</text><g transform="translate(0 44)"><rect width="760" height="315" fill="white"></rect><text x="22" y="24" fill="#35513e" font-size="14">局部符号关系：颜色表示放大 / 收缩倾向</text><rect x="110" y="55" width="275" height="108" rx="6" fill="#dcebe7"></rect><text x="247" y="88" fill="#35513e" font-size="14" text-anchor="middle">A &gt; 0；δ &lt; 0</text><text x="247" y="120" fill="#35513e" font-size="14" text-anchor="middle">沿局部方向收缩 gap</text><rect x="400" y="55" width="275" height="108" rx="6" fill="#f7e7d2"></rect><text x="537" y="88" fill="#35513e" font-size="14" text-anchor="middle">A &gt; 0；δ &gt; 0</text><text x="537" y="120" fill="#35513e" font-size="14" text-anchor="middle">沿局部方向放大 gap</text><rect x="110" y="175" width="275" height="108" rx="6" fill="#f7e7d2" stroke="#254f36" stroke-width="3"></rect><text x="247" y="208" fill="#35513e" font-size="14" text-anchor="middle">A &lt; 0；δ &lt; 0</text><text x="247" y="240" fill="#35513e" font-size="14" text-anchor="middle">沿局部方向放大 gap</text><text x="247" y="265" fill="#35513e" font-size="14" text-anchor="middle">TRIAGE gate 的方向条件</text><rect x="400" y="175" width="275" height="108" rx="6" fill="#dcebe7"></rect><text x="537" y="208" fill="#35513e" font-size="14" text-anchor="middle">A &lt; 0；δ &gt; 0</text><text x="537" y="240" fill="#35513e" font-size="14" text-anchor="middle">沿局部方向收缩 gap</text></g><text x="25" y="383" font-size="11">训练端已低估，负优势值继续下调概率：满足 TRIAGE gate 的方向条件。是否衰减还取决于片段平均 gap 与尾部风险</text><text x="25" y="403" font-size="11">。 · 切换优势值与 gap 的符号，查看局部放大或收缩倾向及 TRIAGE 的方向条件。图只解释第 2.4 节的局部分析</text><text x="25" y="423" font-size="11">；是否触发 gate 仍取决于片段风险，真实更新还受跨 token 耦合与优化器影响。</text></svg>