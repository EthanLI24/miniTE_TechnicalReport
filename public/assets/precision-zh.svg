<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" role="img" aria-label="前向 NVFP4，反向独立配置"><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#35513e} [data-tip]{cursor:default}</style><rect width="760" height="438" fill="white"/><text x="25" y="28" font-size="17" font-weight="600">前向 NVFP4，反向独立配置</text><g transform="translate(0 44)"><rect width="760" height="300" fill="white"></rect><text x="25" y="25" fill="#35513e" font-size="14">NVFP4 前向不变；dgrad / wgrad 的精度独立选择</text><rect x="25" y="62" width="210" height="72" rx="6" fill="#e9eef3"></rect><text x="130" y="92" fill="#35513e" font-size="14" text-anchor="middle">原始 BF16 X、W</text><text x="130" y="118" fill="#35513e" font-size="14" text-anchor="middle">保存供反向使用</text><line x1="235" y1="98" x2="282" y2="98" stroke="#6f8878" stroke-width="2"></line><rect x="282" y="62" width="213" height="72" rx="6" fill="#dcebe7"></rect><text x="388" y="105" fill="#35513e" font-size="14" text-anchor="middle">NVFP4 quantize</text><line x1="495" y1="98" x2="544" y2="98" stroke="#6f8878" stroke-width="2"></line><rect x="544" y="62" width="192" height="72" rx="6" fill="#dcebe7"></rect><text x="640" y="92" fill="#35513e" font-size="14" text-anchor="middle">NVFP4 fprop</text><text x="640" y="118" fill="#35513e" font-size="14" text-anchor="middle">GEMM</text><path d="M130 134 V219 H282" fill="none" stroke="#309576" stroke-width="2"></path><rect x="282" y="180" width="454" height="88" rx="6" fill="#f3f0f7"></rect><text x="509" y="215" fill="#35513e" font-size="14" text-anchor="middle">BF16 dgrad / wgrad</text><text x="509" y="246" fill="#35513e" font-size="14" text-anchor="middle">使用保存的原始 BF16 操作数</text></g><text x="25" y="368" font-size="11">BF16 反向保留高精度操作数，并减少反向量化准备。完整训练更新的主测试中，这一路径取得约 1.33–1.37× 的 BF</text><text x="25" y="388" font-size="11">16 配对加速。 · 图示对应报告中两条 miniTE 路径的前向与两种反向选择。BF16 反向使用保存的原始 BF16 </text><text x="25" y="408" font-size="11">操作数；切换反向精度时，前向仍为 NVFP4。静态版展示 BF16 反向路径。</text></svg>